name: Release

# Build the macOS .dmg from a version tag and attach it to the GitHub Release.
# GitHub auto-creates the Release for the pushed tag; we only upload the artifact.
# If the Apple signing secrets are configured, the build is signed + notarized;
# otherwise it falls back to an unsigned build automatically.
on:
  push:
    tags:
      - 'v*'

# Needed so the default GITHUB_TOKEN can create the Release and upload the .dmg.
permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-macos-dmg:
    name: Build macOS arm64 dmg
    runs-on: macos-14            # Apple Silicon (arm64) runner
    timeout-minutes: 120         # safety net: harness build + packaging are heavy
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22       # latest 22.x; the harness requires ^22.19 or >=24
          cache: npm

      - name: Set up pnpm 11
        uses: pnpm/action-setup@v4
        with:
          version: 11.7.0
          run_install: false     # harness deps are installed in the build step below

      - name: Install app dependencies (npm ci)
        run: npm ci
        # Installs electron + electron-builder. Electron itself is downloaded by
        # its postinstall into node_modules/electron/dist; package.json's
        # build.electronDist points there, so electron-builder reuses it instead
        # of downloading Electron a second time.

      # ---------------------------------------------------------------------
      # Code signing + notarization (only when the certificate secret exists).
      # See SIGNING.md for how to create the APPLE_* secrets. When they are
      # absent, the unsigned package step below runs instead.
      # ---------------------------------------------------------------------
      - name: Check for signing secrets
        id: signing
        env:
          APPLE_CERTIFICATE_BASE64: ${{ secrets.APPLE_CERTIFICATE_BASE64 }}
        run: |
          if [ -n "$APPLE_CERTIFICATE_BASE64" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
            echo "Signing enabled (certificate secret present)."
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "Signing disabled (no certificate secret) — building unsigned."
          fi

      - name: Decode signing certificate (.p12)
        if: steps.signing.outputs.enabled == 'true'
        env:
          APPLE_CERTIFICATE_BASE64: ${{ secrets.APPLE_CERTIFICATE_BASE64 }}
        run: echo "$APPLE_CERTIFICATE_BASE64" | base64 --decode > /tmp/dsh-desktop.p12

      - name: Import signing certificate into keychain
        if: steps.signing.outputs.enabled == 'true'
        env:
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          KEYCHAIN_PASSWORD="$RUNNER_TEMP"
          security create-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security import /tmp/dsh-desktop.p12 \
            -k build.keychain \
            -P "$APPLE_CERTIFICATE_PASSWORD" \
            -T /usr/bin/codesign \
            -T /usr/bin/productsign
          # Allow codesign/notarytool to use the private key without a UI prompt.
          security set-key-partition-list \
            -S apple-tool:,apple: \
            -s -k "$KEYCHAIN_PASSWORD" build.keychain
          security set-keychain-settings -lut 21600 build.keychain

      - name: Export signing & notarization environment variables
        if: steps.signing.outputs.enabled == 'true'
        env:
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          echo "CSC_LINK=/tmp/dsh-desktop.p12" >> "$GITHUB_ENV"
          echo "CSC_KEY_PASSWORD=$APPLE_CERTIFICATE_PASSWORD" >> "$GITHUB_ENV"
          echo "APPLE_ID=$APPLE_ID" >> "$GITHUB_ENV"
          echo "APPLE_APP_SPECIFIC_PASSWORD=$APPLE_APP_SPECIFIC_PASSWORD" >> "$GITHUB_ENV"
          echo "APPLE_TEAM_ID=$APPLE_TEAM_ID" >> "$GITHUB_ENV"

      - name: Bundle DeepSeek Harness into harness.tar
        timeout-minutes: 30      # pnpm install + build of the monorepo is the slow step
        env:
          # The reviewed desktop patches are tied to this Harness revision.
          # Upgrade it deliberately together with refreshed patches and tests.
          HARNESS_REV: 47f943859bef60e4160492346772ded9b24f765a
        run: |
          # WHY regenerate: harness.tar (~1.6 GB, includes node_modules) is in
          # .gitignore, so CI must rebuild it from source on every release. At
          # first run the app extracts it and needs the BUILT CLI at
          # apps/cli/lib/bin.js (see lib/harness.js).
          git clone --filter=blob:none --no-checkout https://github.com/deepseek-ai/deepseek-harness.git harness
          cd harness
          git checkout --detach "$HARNESS_REV"
          # The desktop product removes the beta declaration while preserving
          # the useful DeepSeek credential onboarding. Fail if upstream drift
          # makes the reviewed patch no longer apply cleanly.
          git apply --check ../patches/remove-welcome-notice.patch
          git apply ../patches/remove-welcome-notice.patch
          # The official settings surface gains the desktop's plugin lifecycle
          # controls here. Keep it separate from the welcome-copy patch so
          # either concern can be audited and upgraded independently.
          git apply --check ../patches/harness-plugin-lifecycle.patch
          git apply ../patches/harness-plugin-lifecycle.patch
          # Keep the desktop's Chinese mode fully localized in both the
          # permission settings row and the in-session picker.
          git apply --check ../patches/harness-zh-permission-presets.patch
          git apply ../patches/harness-zh-permission-presets.patch
          pnpm install
          pnpm run build
          test -f apps/cli/lib/bin.js   # fail fast if the CLI wasn't built
          cd ..
          # -C harness => tar contents are apps/, packages/, ... with no
          # top-level harness/ dir; --exclude .git keeps the archive smaller.
          tar -cf harness.tar --exclude .git -C harness .
          node scripts/write-harness-bundle-manifest.js \
            --archive harness.tar \
            --output harness.bundle.json \
            --revision "$HARNESS_REV"
          test -f harness.bundle.json

      - name: Bundle Node 22 runtime (runtime/node)
        run: |
          # WHY regenerate: runtime/node is also .gitignore'd. Electron 33
          # bundles Node 20, which is too old for the harness runtime (needs
          # Node >=22), so the app ships its own Node 22 arm64 binary and
          # spawns it from main.js (BUNDLED_NODE).
          curl -fsSL -o node-v22.23.1-darwin-arm64.tar.gz \
            https://nodejs.org/dist/v22.23.1/node-v22.23.1-darwin-arm64.tar.gz
          tar -xzf node-v22.23.1-darwin-arm64.tar.gz
          mkdir -p runtime
          cp node-v22.23.1-darwin-arm64/bin/node runtime/node
          chmod +x runtime/node
          rm -rf node-v22.23.1-darwin-arm64 node-v22.23.1-darwin-arm64.tar.gz
          ./runtime/node --version   # sanity check: the binary runs on this arm64 runner

      - name: Bundle pnpm 11.7.0 runtime (runtime/pnpm)
        run: |
          # pnpm 的入口会 import 同级 dist/ 目录，因此打包完整 npm 产物而非只取 bin/pnpm.cjs。
          # 用 registry 直链取 tarball（文件名确定），规避 npm pack 输出在部分 npm 版本下
          # 被 --silent 吞掉、导致 PNPM_TARBALL 为空而 tar 失败的问题。
          PNPM_VERSION="11.7.0"
          PNPM_TARBALL="pnpm-${PNPM_VERSION}.tgz"
          curl -fsSL -o "$PNPM_TARBALL" "https://registry.npmjs.org/pnpm/-/pnpm-${PNPM_VERSION}.tgz"
          mkdir -p runtime/pnpm
          tar -xzf "$PNPM_TARBALL" --strip-components=1 -C runtime/pnpm
          rm -f "$PNPM_TARBALL"
          test -f runtime/pnpm/bin/pnpm.cjs
          test -f runtime/pnpm/dist/pnpm.cjs
          test "$(./runtime/node runtime/pnpm/bin/pnpm.cjs --version)" = "$PNPM_VERSION"

      - name: Package & publish DMG (signed & notarized)
        if: steps.signing.outputs.enabled == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Signing env (CSC_LINK / APPLE_*) was exported by the step above;
          # package.json has hardenedRuntime + entitlements + notarize: true.
          # --publish always uploads the dmg + latest-mac.yml + blockmap to the
          # GitHub Release so electron-updater can serve auto-updates.
          npx electron-builder --mac dmg --publish always

      - name: Package & publish DMG (unsigned)
        if: steps.signing.outputs.enabled != 'true'
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'   # no Apple cert → unsigned build
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx electron-builder --mac dmg --publish always
